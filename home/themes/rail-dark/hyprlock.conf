# Rail Dark theme for Hyprlock

background {
    monitor =
    path = screenshot
    color = rgba(1e222aff)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.05
    brightness = 0.62
    vibrancy = 0.20
    vibrancy_darkness = 0.22
}

shape {
    monitor =
    size = 720, 430
    color = rgba(252a34cc)
    rounding = 8
    border_size = 2
    border_color = rgba(3b4252ff)
    shadow_passes = 2
    shadow_size = 24
    shadow_color = rgba(1e222a66)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(cfd6e2ff)
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    position = 0, 138
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"
    color = rgba(cfd6e2ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 72
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER  •  layout: $LAYOUT
    color = rgba(88a4d4ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 62
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.28
    dots_center = true
    outer_color = rgba(88a4d4ff) rgba(88c0d0ff) 45deg
    inner_color = rgba(1e222acc)
    font_color = rgba(cfd6e2ff)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>  password</i>
    hide_input = false
    check_color = rgba(88c0d0ff)
    fail_color = rgba(bf616aff)
    fail_text = <i>wrong password</i>
    capslock_color = rgba(ebcb8bff)
    numlock_color = rgba(88a4d4ff)
    rounding = 8
    position = 0, -48
    halign = center
    valign = center
}
