# Celestia-like lockscreen: blurred current screen, clean clock, centered password field.
general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    grace = 0
    text_trim = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fade, 1, 6, smooth
    animation = inputFieldDots, 1, 2, smooth
}

source = ~/.config/themes/current/hyprlock.conf
