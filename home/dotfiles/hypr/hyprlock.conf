source = ~/.config/hypr/colors.conf

# Celestia-like lockscreen: blurred current screen, clean clock, centered password field.
general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    grace = 0
    text_trim = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fade, 1, 6, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    path = screenshot
    color = $surface
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.05
    brightness = 0.62
    vibrancy = 0.20
    vibrancy_darkness = 0.22
}

shape {
    monitor =
    size = 720, 430
    color = $surface_alpha
    rounding = 30
    border_size = 2
    border_color = $accent $accent2 45deg
    shadow_passes = 2
    shadow_size = 24
    shadow_color = rgba(00000066)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    position = 0, 138
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"
    color = $text
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 72
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER  •  layout: $LAYOUT
    color = $accent
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 62
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.28
    dots_center = true
    outer_color = $accent $accent2 45deg
    inner_color = rgba(00000055)
    font_color = $text
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>  password</i>
    hide_input = false
    check_color = $accent2
    fail_color = rgba(f38ba8ff)
    fail_text = <i>wrong password</i>
    capslock_color = rgba(f9e2afff)
    numlock_color = $accent
    rounding = 18
    position = 0, -48
    halign = center
    valign = center
}
