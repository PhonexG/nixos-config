[main]
include=~/.config/themes/current/fuzzel.ini
terminal=kitty -e
prompt="   "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic,keywords
match-mode=fuzzy
lines=12
width=40
tabs=4
horizontal-pad=20
vertical-pad=12
inner-pad=8
line-height=22
image-size-ratio=0.3
layer=overlay
anchor=center
exit-on-keyboard-focus-loss=yes

[dmenu]
exit-immediately-if-empty=yes
