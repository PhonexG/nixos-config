[main]
font=JetBrainsMono Nerd Font:weight=medium:size=11.5
terminal=kitty -e
prompt="   "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic,keywords
match-mode=fuzzy
lines=12
width=40
tabs=4
horizontal-pad=20
vertical-pad=12
inner-pad=8
line-height=22
image-size-ratio=0.3
layer=overlay
anchor=center
exit-on-keyboard-focus-loss=yes

[colors]
background=11111bee
text=cdd6f4ff
prompt=cba6f7ff
placeholder=6c7086ff
input=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=6c7086ff
border=89b4fadd

[border]
width=2
radius=18

[dmenu]
exit-immediately-if-empty=yes
